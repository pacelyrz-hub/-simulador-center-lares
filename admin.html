<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center Lares | Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#142033}.box{max-width:430px;margin:60px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 25px #0001}.box input,.box button{width:100%;padding:15px;box-sizing:border-box;margin-top:12px;border-radius:10px;font-size:17px}.box input{border:1px solid #ccd6e2}.box button{border:0;background:#0875e8;color:#fff;font-weight:800}.err{color:#b42318;font-weight:700;margin-top:12px;display:none}.ok{color:#087a3d;font-weight:700;margin-top:12px;display:none}#app{display:none}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;padding:20px;border-radius:18px;margin-bottom:20px}.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}.grid input,.grid select,.grid textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 12px;border:1px solid #d5dfeb;border-radius:10px;font:inherit}.grid textarea{min-height:100px}.btn{background:#0875e8;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="box"><h2>🔐 Área administrativa</h2><p>Digite a senha para acessar os imóveis.</p><input id="senha" type="password" placeholder="Senha" autocomplete="off"><button id="entrar" type="button">ENTRAR</button><div id="erro" class="err">Senha incorreta.</div><div id="ok" class="ok">Acesso liberado!</div></div><div id="app"><div class="wrap"><h1>Center Lares — Painel de imóveis</h1><a href="index.html">← Voltar ao site</a><div class="grid"><div class="card"><h2>Novo imóvel</h2><form id="f"><input name="id" placeholder="Código" required><input name="title" placeholder="Nome do imóvel" required><input name="city" placeholder="Cidade/UF" required><input name="price" type="number" placeholder="Preço atual" required><input name="old" type="number" placeholder="Preço anterior"><input name="area" type="number" placeholder="Área m²"><input name="rooms" type="number" placeholder="Quartos"><input name="baths" type="number" placeholder="Banheiros"><input name="term" placeholder="Prazo/entrega"><textarea name="description" placeholder="Descrição"></textarea><label>Fotos do imóvel</label><input id="pics" type="file" accept="image/*" multiple><div id="preview" class="photos"></div><label><input name="featured" type="checkbox" style="width:auto"> Mostrar em destaque</label><br><br><button class="btn">CADASTRAR IMÓVEL</button></form></div><div class="card"><h2>Imóveis cadastrados neste aparelho</h2><div id="lista"></div></div></div></div></div><script>const SENHA='@CENTEr10';const login=document.getElementById('login'),app=document.getElementById('app'),senha=document.getElementById('senha');function liberar(){login.style.display='none';app.style.display='block';sessionStorage.setItem('center_admin_ok','1')}function verificar(){if(senha.value.trim().toLowerCase()===SENHA.toLowerCase()){document.getElementById('erro').style.display='none';document.getElementById('ok').style.display='block';liberar()}else{document.getElementById('erro').style.display='block';senha.value='';senha.focus()}}document.getElementById('entrar').onclick=verificar;senha.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();verificar()}};if(sessionStorage.getItem('center_admin_ok')==='1')liberar();let fotos=[],lista=JSON.parse(localStorage.getItem('center_lares_admin')||'[]');document.getElementById('pics').onchange=e=>{fotos=[];[...e.target.files].forEach(file=>{let r=new FileReader();r.onload=()=>{fotos.push(r.result);document.getElementById('preview').innerHTML=fotos.map(x=>'<img src="'+x+'">').join('')};r.readAsDataURL(file)})};document.getElementById('f').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);lista.push({id:d.get('id'),title:d.get('title'),city:d.get('city'),price:d.get('price'),old:d.get('old'),area:d.get('area'),rooms:d.get('rooms'),baths:d.get('baths'),term:d.get('term'),description:d.get('description'),featured:e.target.featured.checked,photos:fotos});localStorage.setItem('center_lares_admin',JSON.stringify(lista));e.target.reset();fotos=[];document.getElementById('preview').innerHTML='';mostrar()};function mostrar(){document.getElementById('lista').innerHTML=lista.length?lista.map((p,i)=>'<div style="border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0"><b>'+p.title+'</b><br>'+p.city+' · R$ '+Number(p.price||0).toLocaleString('pt-BR')+'<br>'+p.photos.length+' foto(s)<br><button class="btn" style="background:#b42318" onclick="excluir('+i+')">EXCLUIR</button></div>').join(''):'Nenhum imóvel cadastrado.'}function excluir(i){if(confirm('Excluir este imóvel?')){lista.splice(i,1);localStorage.setItem('center_lares_admin',JSON.stringify(lista));mostrar()}}mostrar();</script></body></html>
