<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center Lares | Admin</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#142033}.box{max-width:500px;margin:70px auto;padding:30px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:15px;margin-top:10px;box-sizing:border-box;border-radius:10px;font-size:18px}input{border:1px solid #ccc}button{border:0;background:#0875e8;color:white;font-weight:bold}.hide{display:none}.err{color:#c00;font-weight:bold;margin-top:10px}</style></head><body><div id="login" class="box"><h1>🔐 Área administrativa</h1><p>Digite a senha para acessar.</p><input id="senha" type="password" inputmode="numeric" autocomplete="off" placeholder="Senha numérica"><button type="button" id="entrar">ENTRAR</button><div id="erro" class="err"></div></div><div id="painel" class="box hide"><h1>✅ Painel Center Lares</h1><p>Acesso liberado.</p><h2>Cadastrar imóvel</h2><p>O painel administrativo está funcionando.</p><button type="button" onclick="sair()">SAIR</button></div><script>const SENHA='1010';const login=document.getElementById('login'),painel=document.getElementById('painel'),senha=document.getElementById('senha'),erro=document.getElementById('erro');function abrir(){login.classList.add('hide');painel.classList.remove('hide')}document.getElementById('entrar').onclick=function(){if(senha.value===SENHA){erro.textContent='';abrir()}else{erro.textContent='Senha incorreta';senha.value='';senha.focus()}};senha.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('entrar').click()});function sair(){painel.classList.add('hide');login.classList.remove('hide');senha.value='';senha.focus()}</script></body></html>
