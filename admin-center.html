<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center Lares | Administração</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#142033}.box{max-width:430px;margin:70px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;box-sizing:border-box;margin-top:10px;border-radius:10px;font-size:16px}input{border:1px solid #ccd6e2}button{border:0;background:#0875e8;color:white;font-weight:bold}.err{color:#b42318;font-weight:bold;margin-top:10px}#app{display:none}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;padding:20px;border-radius:18px;margin-bottom:20px}.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="box"><h2>🔐 Área administrativa</h2><p>Digite a senha para entrar.</p><input id="senha" type="password" placeholder="Senha" autocomplete="off"><button type="button" onclick="entrar()">ENTRAR</button><div id="erro" class="err"></div></div><div id="app"><div class="wrap"><h1>Center Lares — Painel de imóveis</h1><a href="index.html">← Voltar ao site</a><div class="grid"><div class="card"><h2>Novo imóvel</h2><form id="f"><input name="id" placeholder="Código (ex.: CL-005)" required><input name="title" placeholder="Nome do imóvel" required><input name="city" placeholder="Cidade/UF" required><input name="price" type="number" placeholder="Preço atual" required><input name="old" type="number" placeholder="Preço anterior"><input name="area" type="number" placeholder="Área m²"><input name="rooms" type="number" placeholder="Quartos"><input name="baths" type="number" placeholder="Banheiros"><input name="term" placeholder="Prazo/entrega"><textarea name="description" placeholder="Descrição" style="width:100%;height:90px;margin-top:10px;padding:12px;box-sizing:border-box"></textarea><input id="pics" type="file" accept="image/*" multiple><div id="preview" class="photos"></div><label style="display:block;margin-top:12px"><input name="featured" type="checkbox" style="width:auto"> Mostrar em destaque</label><button>CADASTRAR IMÓVEL</button></form></div><div class="card"><h2>Imóveis cadastrados neste aparelho</h2><div id="lista"></div></div></div></div></div><script>const SENHA='@CENTEr10',KEY='center_lares_imoveis_v3';let fotos=[],lista=JSON.parse(localStorage.getItem(KEY)||'[]');function entrar(){const s=document.getElementById('senha').value.trim();if(s===SENHA){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';mostrar()}else{document.getElementById('erro').textContent='Senha incorreta.';document.getElementById('senha').value='';document.getElementById('senha').focus()}}document.getElementById('senha').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});document.getElementById('pics').onchange=e=>{fotos=[];[...e.target.files].forEach(file=>{let r=new FileReader();r.onload=()=>{fotos.push(r.result);document.getElementById('preview').innerHTML=fotos.map(x=>`<img src="${x}">`).join('')};r.readAsDataURL(file)})};document.getElementById('f').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),p={id:d.get('id'),title:d.get('title'),city:d.get('city'),price:d.get('price'),old:d.get('old'),area:d.get('area'),rooms:d.get('rooms'),baths:d.get('baths'),term:d.get('term'),description:d.get('description'),featured:e.target.featured.checked,photos:fotos};lista.push(p);localStorage.setItem(KEY,JSON.stringify(lista));e.target.reset();fotos=[];document.getElementById('preview').innerHTML='';mostrar()};function mostrar(){document.getElementById('lista').innerHTML=lista.length?lista.map((p,i)=>`<div style="border:1px solid #ddd;padding:12px;border-radius:10px;margin-bottom:10px"><b>${p.title}</b><br>${p.city} · R$ ${Number(p.price).toLocaleString('pt-BR')}<br>${p.photos.length} foto(s)<br><button onclick="excluir(${i})" style="background:#b42318">EXCLUIR</button></div>`).join(''):'Nenhum imóvel cadastrado.'}function excluir(i){if(confirm('Excluir este imóvel?')){lista.splice(i,1);localStorage.setItem(KEY,JSON.stringify(lista));mostrar()}}</script></body></html>
